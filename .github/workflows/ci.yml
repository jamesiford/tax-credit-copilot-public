name: CI

on:
  push:
    branches: [main, 'feat/**', 'wp/**']
  pull_request:
    branches: [main]
  # Allows `deploy.yml` to use this as a reusable workflow gate.
  workflow_call:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest
        # The private parity fixtures are not in the repo, so the reference
        # gate SKIPS here; TCC_REQUIRE_PARITY=1 enforces it wherever they exist.
        run: pytest tests/ -q --tb=short

  frontend-tests:
    name: Frontend vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        # npm ci respects the lockfile exactly (vs `npm install` which can
        # swap esbuild's native binary out from under us on a Linux runner
        # when the lockfile was last touched on Windows).
        run: npm ci --legacy-peer-deps
      - name: Run vitest
        run: npm test
      - name: Build production bundle
        run: npm run build

  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: '8.30.1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan
        run: gitleaks git --no-banner --redact --exit-code 1 .

  terraform:
    name: Terraform fmt / validate / tflint / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive
      - name: init (no backend)
        run: terraform init -backend=false -input=false
      - name: validate
        run: terraform validate
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0
      - name: tflint
        run: tflint --recursive
      - name: test (mock providers)
        run: terraform test

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  whitelabel-audit:
    name: White-label audit (enforced)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: check-whitelabel.ps1 (WL-12)
        # Enforced from B07: every hit outside scripts/whitelabel-allowlist.txt
        # fails the build.
        run: pwsh scripts/check-whitelabel.ps1 -Enforce
      - name: Install openpyxl (for the synthetic-data validator)
        run: pip install openpyxl
      - name: audit-export.py (WL-13, B01.d)
        # Enforced from B07: any finding (raster image, PDF, deny-list hit,
        # or synthetic-data shape violation) fails the build.
        run: python scripts/audit-export.py --enforce
