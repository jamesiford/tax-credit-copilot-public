[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short
markers =
    slow: tests that take more than a few seconds (excluded from quick runs)
    ai_eval: AI quality evals with thresholds (offline by default; TCC_AI_EVALS_LIVE=1 adds live)
filterwarnings =
    ignore::DeprecationWarning:azure\..*
    ignore::DeprecationWarning:pydantic\..*
