# OPTIONAL, local container use only: production uses frontend/server/ (Node 24).
# Tax Credit Copilot — nginx config served by the web Container App.
# `${API_BACKEND_URL}` is substituted at startup by envsubst (nginx:alpine
# does this automatically for any /etc/nginx/templates/*.template).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every unmatched route serves index.html so client-side
    # navigation works on hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy /api/* to the API Container App. SSE-friendly:
    # buffering off + long read timeout so the chat stream isn't held back.
    # Container Apps' edge requires SNI on the upstream TLS handshake; without
    # `proxy_ssl_server_name on` nginx sends no SNI and the edge resets.
    location /api/ {
        proxy_pass         ${API_BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header   Host ${API_BACKEND_HOST};
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name     ${API_BACKEND_HOST};
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # Long cache on hashed asset files; index.html stays uncached so deploys
    # take effect on next page load.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
