# gitleaks configuration: the default rules plus one narrow allowance.
#
# `record_token` is an opaque SHA-256-derived handle for an employee row (see
# backend/tools/tokens.py). Test fixtures pass literal hex values for it, which
# the generic-api-key rule reads as a credential. It is not one: it grants
# nothing and resolves only inside a run the caller can already read.

[extend]
useDefault = true

[[allowlists]]
description = "record_token fixtures in frontend tests and the live egress check are made-up opaque row handles, not credentials"
condition = "AND"
paths = ['''^frontend/src/.*\.test\.jsx?$''', '''^scripts/live-ai-checks\.py$''']
regexTarget = "line"
regexes = ['''(?i)record_?token''']

[[allowlists]]
description = "the orchestrator's vendor manifest is a list of SHA-256 digests of source files (generated, gitignored; one WIP commit held it)"
paths = ['''^channel_orchestrator/app/vendor/tcc_shared/MANIFEST\.json$''']

[[allowlists]]
description = "RM-09 commit ae0428d held one made-up 24-hex employee row handle as a test literal (the egress test); it is not a credential and the literal is gone from the file"
paths = ['''^backend/tests/channel_orchestrator/test_orch_foundry_client\.py$''']
regexTarget = "line"
regexes = ['''0123456789abcdef01234567''']
