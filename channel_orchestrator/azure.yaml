# The orchestrator as an azd project of its own, deployed from source (no container registry).
# This file IS the agent's declarative definition: `azure.yaml` is the single project file for a hosted agent, and the
# older two-file model (agent.manifest.yaml + agent.yaml) is legacy and rejected by the current `azd ai agent init`
# (Microsoft Learn, "azure.yaml reference for hosted agents" and "agent.yaml schema reference", read 2026-11-04).
# test_orch_agent_definition.py holds it to that reference. What the agent does is code (app/); how it is deployed is here.
# Written to the `azd ai agent` schema (extension azure.ai.agents 1.0.0-beta.23; the shape below is what
# `azd ai agent init --deploy-mode code --protocol responses --protocol activity` generates, adapted):
# https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/deploy-hosted-agent-code
#
#   python scripts/vendor-orchestrator.py          # copy the shared modules in first (the zip needs them)
#   cd channel_orchestrator && azd env new <name>  # then set the values below with `azd env set`
#   azd deploy
#
# The deploying person needs "Foundry Project Manager" on the project. Environment variables the
# platform injects (FOUNDRY_*, APPLICATIONINSIGHTS_CONNECTION_STRING, AZURE_AI_MODEL_DEPLOYMENT_NAME)
# are reserved and are not set here. The orchestrator's own variables are in docs/architecture/ENV-VARS.md
# section "Channel orchestrator"; supply them with `azd env set` and list them under `env:` below.
# `proj-tcc` is the existing Foundry project: set `endpoint` to your project's endpoint (the azd
# environment value FOUNDRY_PROJECT_ENDPOINT is what the deploy actually uses).
requiredVersions:
  extensions:
    azure.ai.agents: ">=1.0.0-beta.20"
name: tcc-channel-orchestrator
services:
  foundry-project:
    host: azure.ai.project
    endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
  tcc-channel-orchestrator:
    project: .
    host: azure.ai.agent
    language: python
    kind: hosted
    name: tcc-channel-orchestrator
    description: Reads a Teams or Copilot Chat message, runs the platform's tools through the channel gateway and replies in the engine's own figures.
    uses:
      - foundry-project
    env:
      PYTHONNOUSERSITE: "1"
      CHANNEL_GATEWAY_URL: ${CHANNEL_GATEWAY_URL}
      CHANNEL_GATEWAY_AUDIENCE: ${CHANNEL_GATEWAY_AUDIENCE}
      TENANT_ID: ${TENANT_ID}
      CHANNEL_NAME: ${CHANNEL_NAME=teams}
      CHANNEL_DEBUG_WHOAMI: ${CHANNEL_DEBUG_WHOAMI=false}
      LOG_LEVEL: ${LOG_LEVEL=INFO}
      CHANNEL_IDENTITY_SOURCES: ${CHANNEL_IDENTITY_SOURCES=original-subject,platform,agent-user-id}
      FOUNDRY_MODEL: ${FOUNDRY_MODEL=gpt-4.1-mini}
      AI_PROVIDER_CHAIN: ${AI_PROVIDER_CHAIN=foundry}
    agentEndpoint:
      # The endpoint (not the container) declares `activity`: with it only here the platform converts a Teams
      # message to a Responses call for this Responses-only container. Declared on the container too, it posts
      # Teams messages to /activity/messages, which this container does not serve (404). [CH-14, D-100]
      authorizationSchemes:
        - type: Entra
        - type: BotServiceRbac
      protocols:
        - responses
        - activity
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    protocols:
      - protocol: responses
        version: 2.0.0
infra:
  provider: microsoft.foundry
